{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ project_name }}{% endblock %}</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    <header class="studio-header">
        <div class="container d-flex align-items-center gap-3 py-3">
            <img
                class="studio-logo"
                src="{% static 'homepage/img/logo.png' %}"
                alt="Логотип сервиса"
            >
            <div>
                <p class="studio-brand mb-0">{{ project_name }}</p>
                <p class="studio-tagline mb-0">Для музыкантов и групп</p>
            </div>
        </div>
        {% include "includes/navigation.html" %}
    </header>
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>
    <footer class="studio-footer">
        <div class="container py-3">
            <p class="mb-1">{{ project_name }}, {{ current_year }}</p>
            <p class="mb-0" id="js-status"></p>
        </div>
    </footer>
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
